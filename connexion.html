<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIENVENUE CHEZ HAMIDOU - Connexion</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #103c2d, #267957);
}

.login-box {
    width: 90%;
    max-width: 430px;
    background: white;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    text-align: center;
}

h1 {
    color: #103c2d;
    margin-bottom: 10px;
}

.subtitle {
    color: #666;
    margin-bottom: 30px;
}

label {
    display: block;
    text-align: left;
    margin-bottom: 8px;
    font-weight: bold;
    color: #333;
}

input {
    width: 100%;
    padding: 14px;
    margin-bottom: 20px;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #103c2d;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #267957;
}

#error {
    color: #c62828;
    margin-top: 15px;
    font-weight: bold;
}

.demo {
    margin-top: 25px;
    padding: 15px;
    background: #f5f7f6;
    border-radius: 10px;
    color: #444;
    font-size: 14px;
}
</style>

</head>

<body>

<div class="login-box">

<h1>BIENVENUE CHEZ HAMIDOU</h1>

<p class="subtitle">
Connexion à votre logiciel de gestion
</p>

<form id="loginForm">

<label for="username">Identifiant</label>
<input
type="text"
id="username"
placeholder="Votre identifiant"
required

>

<label for="password">Mot de passe</label>
<input
type="password"
id="password"
placeholder="Votre mot de passe"
required

>

<button type="submit">
🔐 Se connecter
</button>

<p id="error"></p>

</form>

<div class="demo">
<strong>Comptes de démonstration :</strong><br><br>
Administrateur : <strong>admin</strong> / <strong>admin123</strong><br>
Employé : <strong>employe</strong> / <strong>employe123</strong>
</div>

</div>

<script>

document.getElementById("loginForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;
    const error = document.getElementById("error");

    if (username === "admin" && password === "admin123") {

        window.location.href = "index.html";

    } else if (username === "employe" && password === "employe123") {

        window.location.href = "index.html";

    } else {

        error.textContent = "❌ Identifiant ou mot de passe incorrect.";

    }

});

</script>

</body>
</html>
